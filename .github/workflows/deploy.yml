name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://itsdd.vn

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Worker
        run: pnpm build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --domain itsdd.vn

      - name: Verify production
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://itsdd.vn/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://itsdd.vn/en/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://itsdd.vn/_emdash/api/setup/status | jq -e '.data.needsSetup == false' > /dev/null
